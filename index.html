<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4f0"><title>とりあえずBOX</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#282a30;background:#f6f4f0}*{box-sizing:border-box}body{margin:0}.app{max-width:690px;margin:auto;padding:32px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;letter-spacing:-1px;margin:0}.sub{color:#888990;font-size:12px;margin:8px 0 28px}.count{font-size:12px;background:#e9e6df;padding:8px 12px;border-radius:30px}.composer,.item,.empty{background:white;border:1px solid #ebe9e4;border-radius:20px;padding:18px;box-shadow:0 5px 24px #25252506}textarea{width:100%;border:0;outline:0;resize:vertical;min-height:76px;font:16px inherit;line-height:1.6;color:#292929}textarea::placeholder{color:#a4a4a7}.composer-bottom,.tools,.item-top,.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.composer-bottom{margin-top:12px}button,select,input{font:inherit}button{cursor:pointer;border:0}.primary{background:#303b35;color:white;padding:12px 22px;border-radius:12px;font-weight:700}.primary:active{transform:scale(.98)}select,input[type=date],input[type=text]{background:#f8f7f4;border:1px solid #e8e6e0;border-radius:10px;padding:10px;color:#555;font-size:13px;min-width:0}.tools{margin:28px 0 16px}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.tab{padding:9px 12px;white-space:nowrap;background:transparent;border-radius:10px;color:#777;font-size:13px}.tab.active{background:#303b35;color:white}.search{width:100%;margin-top:10px}#list{display:grid;gap:10px}.item{padding:16px}.item.done{opacity:.58}.item-top{align-items:start}.bodytext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:15px;flex:1}.done .bodytext{text-decoration:line-through}.item-bottom{margin-top:15px}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:#8a8a8a}.pill{border-radius:7px;background:#f3f2ef;padding:5px 8px}.priority{color:#a35c3e;background:#fff0e8}.actions{display:flex;gap:5px}.iconbtn{background:#f7f6f3;border-radius:9px;padding:8px 10px;color:#60605d}.check{width:23px;height:23px;accent-color:#303b35;cursor:pointer}.empty{text-align:center;padding:45px 20px;color:#8a8a8a;font-size:14px}.sectiontitle{font-size:14px;font-weight:700;margin:0 0 12px}.settings{margin-top:34px;display:flex;gap:8px;flex-wrap:wrap}.secondary{padding:10px 13px;background:#eae7e0;border-radius:10px;font-size:12px;color:#474943}.small{font-size:11px;color:#8c8b87;margin-top:15px;line-height:1.7}dialog{border:0;border-radius:20px;padding:24px;width:min(92vw,470px);box-shadow:0 18px 70px #0003}dialog::backdrop{background:#0006}dialog textarea{border:1px solid #e6e5df;padding:12px;border-radius:10px;margin:10px 0}dialog label{display:block;font-size:12px;color:#777;margin:12px 0 6px}.formrow{display:flex;gap:10px}.formrow>*{flex:1;width:50%}.dialogbuttons{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:440px){.app{padding-top:25px}.composer-bottom select{max-width:48%}.tools{align-items:stretch}.tabs{width:100%}}
</style></head><body><main class="app"><header><h1>とりあえずBOX<span style="color:#a7afa4">.</span></h1><span id="count" class="count">0 件</span></header><p class="sub">考える前に、ここに置いておこう。</p><section class="composer"><textarea id="quick" placeholder="忘れたくないこと、やること、思いついたこと…"></textarea><div class="composer-bottom"><select id="newCategory" aria-label="カテゴリ"><option value="未整理">未整理</option><option value="仕事">仕事</option><option value="プライベート">プライベート</option></select><button class="primary" id="add">＋ BOXに入れる</button></div></section><section class="tools"><div class="tabs" id="tabs"><button class="tab active" data-tab="すべて">すべて</button><button class="tab" data-tab="未整理">未整理</button><button class="tab" data-tab="仕事">仕事</button><button class="tab" data-tab="プライベート">プライベート</button><button class="tab" data-tab="完了">完了</button></div><input class="search" id="search" type="text" placeholder="🔎 キーワードで検索"></section><h2 class="sectiontitle" id="heading">BOXの中身</h2><div id="list"></div><div class="settings"><button class="secondary" id="export">データを書き出す</button><button class="secondary" id="importBtn">バックアップを読み込む</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p class="small">データはこの端末のブラウザ内に保存されます。別の端末には自動同期されません。ブラウザのデータ削除に備えて、定期的にバックアップしてください。</p></main><dialog id="editor"><h2 style="margin:0;font-size:19px">内容を編集</h2><label for="editText">内容</label><textarea id="editText"></textarea><div class="formrow"><div><label for="editCategory">カテゴリ</label><select id="editCategory" style="width:100%"><option>未整理</option><option>仕事</option><option>プライベート</option></select></div><div><label for="editPriority">優先度</label><select id="editPriority" style="width:100%"><option value="普通">普通</option><option value="高">高</option><option value="低">低</option></select></div></div><label for="editDate">期限 (任意)</label><input id="editDate" type="date" style="width:100%"><div class="dialogbuttons"><button class="secondary" id="cancel">キャンセル</button><button class="primary" id="save">保存</button></div></dialog><script>
(()=>{'use strict';const KEY='toriaezu-box-v1';let items=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))items=v.filter(valid)}catch{}let tab='すべて',editId=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch{alert('保存できませんでした。端末の空き容量やブラウザ設定を確認してください。')}};const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2);function valid(x){return x&&typeof x.id==='string'&&typeof x.text==='string'&&['未整理','仕事','プライベート'].includes(x.category)&&typeof x.done==='boolean'}function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function render(){const q=$('search').value.trim().toLowerCase();const shown=items.filter(x=>(tab==='すべて'? !x.done:tab==='完了'?x.done:!x.done&&x.category===tab)&&x.text.toLowerCase().includes(q)).sort((a,b)=>Number(a.done)-Number(b.done)||Number(b.priority==='高')-Number(a.priority==='高')||String(a.date||'9999').localeCompare(String(b.date||'9999'))||b.created-a.created);$('count').textContent=items.filter(x=>!x.done).length+' 件';$('heading').textContent=tab==='すべて'?'BOXの中身':tab+' の中身';const list=$('list');list.replaceChildren();if(!shown.length){list.append(make('div','empty',q?'一致するメモはありません':'まだ何もありません。思いついたことを入れてみよう。'));return}for(const x of shown){const card=make('article','item'+(x.done?' done':'')),top=make('div','item-top'),check=make('input','check');check.type='checkbox';check.checked=x.done;check.setAttribute('aria-label','完了にする');check.addEventListener('change',()=>{x.done=check.checked;save();render()});top.append(check,make('div','bodytext',x.text));card.append(top);const bottom=make('div','item-bottom'),meta=make('div','meta');meta.append(make('span','pill',x.category));if(x.priority==='高')meta.append(make('span','pill priority','優先'));if(x.date)meta.append(make('span','pill','期限 '+x.date));const actions=make('div','actions'),edit=make('button','iconbtn','編集'),del=make('button','iconbtn','削除');edit.addEventListener('click',()=>openEdit(x.id));del.addEventListener('click',()=>{if(confirm('このメモを削除しますか？')){items=items.filter(v=>v.id!==x.id);save();render()}});actions.append(edit,del);bottom.append(meta,actions);card.append(bottom);list.append(card)}}function openEdit(id){const x=items.find(x=>x.id===id);if(!x)return;editId=id;$('editText').value=x.text;$('editCategory').value=x.category;$('editPriority').value=x.priority||'普通';$('editDate').value=x.date||'';$('editor').showModal()}$('add').addEventListener('click',()=>{const text=$('quick').value.trim();if(!text){$('quick').focus();return}items.unshift({id:uid(),text,category:$('newCategory').value,done:false,priority:'普通',date:'',created:Date.now()});$('quick').value='';save();tab='すべて';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();$('quick').focus()});$('quick').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('add').click()});$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(v=>v.classList.toggle('active',v===b));render()});$('search').addEventListener('input',render);$('cancel').addEventListener('click',()=>$('editor').close());$('save').addEventListener('click',()=>{const x=items.find(x=>x.id===editId),text=$('editText').value.trim();if(!x||!text)return;x.text=text;x.category=$('editCategory').value;x.priority=$('editPriority').value;x.date=$('editDate').value;save();$('editor').close();render()});$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toriaezu-box-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(valid))throw Error('形式が正しくありません');if(!confirm('現在のデータをバックアップの内容で置き換えます。続けますか？'))return;items=data;save();render();alert('復元しました')}catch(err){alert('読み込みに失敗しました: '+err.message)}finally{e.target.value=''}});render()})();
</script></body></html>
